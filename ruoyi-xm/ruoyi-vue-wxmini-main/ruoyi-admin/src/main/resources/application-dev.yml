## 开发环境专用配置
## 使用方式：在 application.yml 中设置 spring.profiles.active: druid,dev

wx:
  miniapp:
    qrcode:
      # 开发/上线前联调用体验版小程序码；正式环境不要使用 dev 配置
      env-version: ${WX_MINI_QRCODE_ENV_VERSION:trial}
      check-path: ${WX_MINI_QRCODE_CHECK_PATH:false}
  pay:
    stub-enabled: false
    profit-sharing-enabled: false
    profit-sharing-auto-submit-enabled: false
    profit-sharing-add-receiver-enabled: false
    profit-sharing-platform-mch-id:
    transfer-enabled: false
    transfer-task-enabled: false
    transfer-live-confirmation:
    refund-retry-max-attempts: 6
    refund-retry-base-delay-ms: 300000
    refund-retry-max-delay-ms: 21600000
    refund-retry-attempt-lease-ms: 900000

wxmini:
  login:
    test-enabled: false
