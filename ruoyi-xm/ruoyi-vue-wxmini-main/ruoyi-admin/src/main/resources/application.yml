# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.8.9
  # 版权年份
  copyrightYear: 2025
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
  profile: ${RUOYI_PROFILE:E:/ruoyi/wx/ruoyi-xm/runtime/uploadPath}
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  redis:
    # 本地联调默认关闭真实 Redis 连接，直接使用内存降级模式
    enabled: false

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid,dev
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  # redis 配置
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（至少32位随机字符串，生产环境请替换为独立密钥）
  secret: RuoYiXmWxMini2026SecureKey!@#$%^&*
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: true
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*,/mall/*,/wxmini/*

wx:
  miniapp:
    qrcode:
      # 正式上线使用 release；体验版测试可切到 trial
      env-version: release
      # 微信侧路径库可能未同步体验版页面，关闭预校验后仍按 page 参数进入指定页面
      check-path: false
    configs:
      - appid: test #微信小程序的appid
        secret: test #微信小程序的Secret
        token: #微信小程序消息服务器配置的token
        aesKey: #微信小程序消息服务器配置的EncodingAESKey
        msgDataFormat: JSON
  # 支付配置
  pay:
    stub-enabled: false
    profit-sharing-enabled: ${WX_PAY_PROFIT_SHARING_ENABLED:true}
    profit-sharing-auto-submit-enabled: ${WX_PAY_PROFIT_SHARING_AUTO_SUBMIT_ENABLED:true}
    profit-sharing-add-receiver-enabled: ${WX_PAY_PROFIT_SHARING_ADD_RECEIVER_ENABLED:true}
    profit-sharing-platform-mch-id: ${WX_PAY_PROFIT_SHARING_PLATFORM_MCH_ID:}
    transfer-enabled: ${WX_PAY_TRANSFER_ENABLED:false}
    transfer-task-enabled: ${WX_PAY_TRANSFER_TASK_ENABLED:false}
    notify-url: ${WX_PAY_NOTIFY_URL:}
    refund-notify-url: ${WX_PAY_REFUND_NOTIFY_URL:}
    appId: ${WX_PAY_APP_ID:}
    mchId: ${WX_PAY_MCH_ID:}
    apiV3Key: ${WX_PAY_API_V3_KEY:}
    # https://pay.weixin.qq.com/doc/v3/merchant/4012365345
    # openssl x509 -in apiclient_cert.pem -noout -serial
    certSerialNo: ${WX_PAY_CERT_SERIAL_NO:}
    privateKeyPath: ${WX_PAY_PRIVATE_KEY_PATH:}
    privateCertPath: ${WX_PAY_PRIVATE_CERT_PATH:}
    publicKeyId: ${WX_PAY_PUBLIC_KEY_ID:}
    publicKeyPath: ${WX_PAY_PUBLIC_KEY_PATH:}

wxmini:
  jwt:
    # 小程序用户/商家端登录态有效期，单位分钟；默认10年，避免登录后频繁过期
    expire-time-minutes: 5256000
  account:
    # 用户注销后再次使用同一微信身份注册的冷静期，防止反复注销/注册滥用权益
    cancel-reregister-delay-days: 7
