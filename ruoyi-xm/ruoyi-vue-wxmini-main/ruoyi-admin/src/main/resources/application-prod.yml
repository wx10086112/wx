## 生产环境覆盖配置
## 启动方式示例：
## java -jar ruoyi-admin.jar --spring.profiles.active=druid,prod

ruoyi:
  profile: ${RUOYI_UPLOAD_PATH}
  addressEnabled: true
  redis:
    enabled: true

logging:
  level:
    com.ruoyi: info
    org.springframework: warn

spring:
  devtools:
    restart:
      enabled: false
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD:}
  datasource:
    druid:
      master:
        url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
      statViewServlet:
        enabled: ${DRUID_STAT_VIEW_ENABLED:false}
        allow: ${DRUID_ALLOW:127.0.0.1}
        login-username: ${DRUID_USERNAME}
        login-password: ${DRUID_PASSWORD}

token:
  secret: ${TOKEN_SECRET}
  expireTime: ${TOKEN_EXPIRE_MINUTES:30}

swagger:
  enabled: false

wx:
  miniapp:
    qrcode:
      env-version: ${WX_MINI_QRCODE_ENV_VERSION:release}
      check-path: ${WX_MINI_QRCODE_CHECK_PATH:false}
    configs:
      - appid: ${WX_MINI_APPID}
        secret: ${WX_MINI_SECRET}
        token: ${WX_MINI_TOKEN:}
        aesKey: ${WX_MINI_AES_KEY:}
        msgDataFormat: JSON
  pay:
    stub-enabled: false
    profit-sharing-enabled: ${WX_PAY_PROFIT_SHARING_ENABLED:true}
    profit-sharing-auto-submit-enabled: ${WX_PAY_PROFIT_SHARING_AUTO_SUBMIT_ENABLED:true}
    profit-sharing-add-receiver-enabled: ${WX_PAY_PROFIT_SHARING_ADD_RECEIVER_ENABLED:true}
    profit-sharing-platform-mch-id: ${WX_PAY_PROFIT_SHARING_PLATFORM_MCH_ID:}
    transfer-enabled: ${WX_PAY_TRANSFER_ENABLED:false}
    transfer-task-enabled: ${WX_PAY_TRANSFER_TASK_ENABLED:false}
    notify-url: ${WX_PAY_NOTIFY_URL}
    refund-notify-url: ${WX_PAY_REFUND_NOTIFY_URL}
    appId: ${WX_PAY_APP_ID}
    mchId: ${WX_PAY_MCH_ID}
    apiV3Key: ${WX_PAY_API_V3_KEY}
    certSerialNo: ${WX_PAY_CERT_SERIAL_NO}
    privateKeyPath: ${WX_PAY_PRIVATE_KEY_PATH}
    privateCertPath: ${WX_PAY_PRIVATE_CERT_PATH}
